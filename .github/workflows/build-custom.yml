name: Build Custom CloudStream

on:
  workflow_dispatch:
  push:
    branches:
      - custom-dns

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Restore signing key
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "${{ secrets.SIGNING_KEY_B64 }}" | base64 --decode > "$RUNNER_TEMP/keystore/custom.jks"

      - name: Grant permission
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assemblePrereleaseRelease
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudStream-Tiar
          path: app/build/outputs/apk/prerelease/release/*.apk
